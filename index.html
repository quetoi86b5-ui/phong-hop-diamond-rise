  [...$('modes').children].forEach(b=>b.classList.toggle('active',b.dataset.m===mode));
  [...$('tabs').children].forEach((b,k)=>b.textContent=angleLabel(k));
  $('v360').hidden=mode!=='360';$('vcmp').hidden=mode!=='cmp';$('vplan').hidden=mode!=='walls';
  $('detail').innerHTML=guide(option.notes)+option.h;
  if(mode==='360')buildPano();
  else if(mode==='cmp')cmp();
  else{
    $('planImage').src=P+option.plan;
    $('planImage').alt='Bản trải bốn vách của PA '+option.n;
    $('planLink').href=P+option.plan;
    [...$('planAngles').children].forEach((b,k)=>b.textContent=angleLabel(wallOrder[k]));
  }
  aicw.setState&&aicw.setState({o,mode});
}
O.forEach((v,k)=>{const b=document.createElement('button');b.className='ui-tab';b.textContent='PA '+v.n;b.onclick=()=>{if(o!==k)pos=0;o=k;render()};$('opts').appendChild(b)});
N.forEach((_,k)=>{const b=document.createElement('button');b.className='ui-tab';b.onclick=()=>{g=k;cmp()};$('tabs').appendChild(b)});
N.forEach((_,k)=>{
  const b=document.createElement('button');b.className='ui-tab';
  b.onclick=()=>{pos=k;mode='360';render()};
  $('planAngles').appendChild(b);
});
[...$('modes').children].forEach(b=>b.onclick=()=>{mode=b.dataset.m;render()});
window.addEventListener('resize',()=>{
  if(mode==='360')buildPano();
  else if(mode==='cmp')cmp();
});
const s=(aicw.getState&&aicw.getState())||{};o=s.o??2;mode=s.mode||'360';render();
setAuto(!window.matchMedia('(prefers-reduced-motion: reduce)').matches);
</script></body></html>
